deployment:
  tasks:
    - 'export APPPATH=/home/vitprofessional/apps/tiaba-dreager'
    - 'export PUBLICPATH=/home/vitprofessional/public_html/drager'

    - '/bin/mkdir -p "$APPPATH" "$PUBLICPATH"'
    - 'test -f "$APPPATH/.env"'
    - 'test -x /usr/local/bin/php'
    - 'test -x /usr/local/bin/composer'
    - 'test -f public/build/manifest.json'

    - '/bin/rm -rf "$APPPATH/app" "$APPPATH/bootstrap" "$APPPATH/config" "$APPPATH/database" "$APPPATH/public" "$APPPATH/resources" "$APPPATH/routes"'

    - '/bin/cp -a app bootstrap config database public resources routes "$APPPATH/"'
    - '/bin/cp artisan composer.json composer.lock "$APPPATH/"'

    - '/bin/mkdir -p "$APPPATH/storage/app/public" "$APPPATH/storage/framework/cache/data" "$APPPATH/storage/framework/sessions" "$APPPATH/storage/framework/views" "$APPPATH/storage/logs"'

    - 'cd "$APPPATH" && /usr/local/bin/composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader'



    - '/bin/rm -rf "$PUBLICPATH/build"'
    - '/bin/cp -a public/build "$PUBLICPATH/"'

    - 'test -f "$PUBLICPATH/.htaccess" || /bin/cp public/.htaccess "$PUBLICPATH/.htaccess"'
    - 'test ! -f public/favicon.ico || /bin/cp public/favicon.ico "$PUBLICPATH/"'
    - 'test ! -f public/robots.txt || /bin/cp public/robots.txt "$PUBLICPATH/"'
    - '/bin/cp deployment/public-index.php "$PUBLICPATH/index.php"'

    - 'test -e "$PUBLICPATH/storage" || test -L "$PUBLICPATH/storage" || /bin/ln -s "$APPPATH/storage/app/public" "$PUBLICPATH/storage"'

    - '/bin/chmod -R ug+rwX "$APPPATH/storage" "$APPPATH/bootstrap/cache"'

    - 'cd "$APPPATH" && /usr/local/bin/php artisan config:cache'
    - 'cd "$APPPATH" && /usr/local/bin/php artisan route:cache'
    - 'cd "$APPPATH" && /usr/local/bin/php artisan view:cache'
    
    - 'cd "$APPPATH" && /usr/local/bin/php artisan migrate --force'
    - 'cd "$APPPATH" && /usr/local/bin/php artisan optimize:clear'